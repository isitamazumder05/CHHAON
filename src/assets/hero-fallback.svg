<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D2619" />
      <stop offset="40%" stop-color="#8C4A28" />
      <stop offset="75%" stop-color="#C8703C" />
      <stop offset="100%" stop-color="#EAA663" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="75%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#FFF2D6" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#F6B86C" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#C85A32" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3D2619" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6E3A20" />
      <stop offset="100%" stop-color="#2D1C12" />
    </linearGradient>
  </defs>

  <!-- Sky & Ambient Sun -->
  <rect width="1600" height="900" fill="url(#skyGrad)" />
  <rect width="1600" height="900" fill="url(#sunGlow)" />

  <!-- Distant scaffolding & cranes silhouettes on the right -->
  <g opacity="0.35" stroke="#4A2511" stroke-width="2">
    <!-- Crane mast -->
    <line x1="1250" y1="120" x2="1250" y2="700" stroke-width="6" />
    <line x1="1250" y1="140" x2="1480" y2="180" stroke-width="4" />
    <line x1="1250" y1="140" x2="1100" y2="200" stroke-width="4" />
    <line x1="1250" y1="120" x2="1350" y2="160" />
    <line x1="1350" y1="160" x2="1450" y2="175" />
    <!-- Scaffolding lattice -->
    <line x1="1380" y1="350" x2="1550" y2="350" stroke-width="3" />
    <line x1="1380" y1="450" x2="1550" y2="450" stroke-width="3" />
    <line x1="1380" y1="550" x2="1550" y2="550" stroke-width="3" />
    <line x1="1400" y1="300" x2="1400" y2="750" stroke-width="3" />
    <line x1="1500" y1="300" x2="1500" y2="750" stroke-width="3" />
    <line x1="1400" y1="350" x2="1500" y2="450" stroke-width="1.5" />
    <line x1="1500" y1="350" x2="1400" y2="450" stroke-width="1.5" />
    <line x1="1400" y1="450" x2="1500" y2="550" stroke-width="1.5" />
    <line x1="1500" y1="450" x2="1400" y2="550" stroke-width="1.5" />
  </g>

  <!-- Ground earth mounds -->
  <path d="M0,680 Q400,640 850,690 T1600,660 L1600,900 L0,900 Z" fill="url(#groundGrad)" />
  <path d="M0,740 Q550,710 1100,750 T1600,720 L1600,900 L0,900 Z" fill="#1C120B" opacity="0.8" />

  <!-- Worker silhouette on the right side with safety gear -->
  <g transform="translate(1080, 220)">
    <!-- Hard Hat (Yellow / Golden highlight) -->
    <ellipse cx="140" cy="85" rx="36" ry="18" fill="#F4B740" />
    <path d="M110,85 C110,50 170,50 170,85 Z" fill="#E59819" />
    <rect x="100" y="82" width="80" height="7" rx="3" fill="#D38106" />

    <!-- Head & Neck -->
    <ellipse cx="140" cy="115" rx="20" ry="24" fill="#3D2619" />
    <rect x="133" y="135" width="16" height="24" fill="#2E1C12" />

    <!-- Torso / High-vis vest -->
    <!-- Inner shirt -->
    <path d="M105,155 L175,155 L185,320 L95,320 Z" fill="#2B3A42" />
    <!-- High-vis Safety Vest over shirt -->
    <path d="M106,155 L130,155 L130,310 L100,310 Z" fill="#F4B740" />
    <path d="M150,155 L174,155 L180,310 L150,310 Z" fill="#F4B740" />
    <path d="M125,230 L155,230 L155,310 L125,310 Z" fill="#DDA025" />
    <!-- Reflective silver stripes on vest -->
    <rect x="104" y="215" width="74" height="12" fill="#E8ECE9" opacity="0.9" />
    <rect x="102" y="270" width="78" height="12" fill="#E8ECE9" opacity="0.9" />

    <!-- Arms & Gloves -->
    <!-- Left arm holding clipboard/gloves -->
    <path d="M105,160 L80,240 L95,290 L115,285 L105,240 Z" fill="#2B3A42" />
    <ellipse cx="95" cy="305" rx="14" ry="18" fill="#A44321" /> <!-- Safety glove -->

    <!-- Right arm relaxed -->
    <path d="M175,160 L195,240 L190,295 L170,290 L180,240 Z" fill="#2B3A42" />
    <ellipse cx="185" cy="310" rx="14" ry="18" fill="#A44321" /> <!-- Safety glove -->

    <!-- Pants & Work boots -->
    <path d="M100,315 L140,315 L135,530 L95,530 Z" fill="#1C242B" />
    <path d="M140,315 L180,315 L185,530 L145,530 Z" fill="#182026" />
    <!-- Heavy work boots -->
    <rect x="85" y="525" width="55" height="24" rx="6" fill="#140E0A" />
    <rect x="140" y="525" width="55" height="24" rx="6" fill="#140E0A" />
  </g>
</svg>
